
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>for my lifelong babygirl 💝</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Pacifico&display=swap');

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 22px;
  font-family: 'Quicksand', sans-serif;
  color: #873e5d;
  background: linear-gradient(145deg, #ffe0eb, #fff4f6, #fbd5e4);
}

.card {
  width: 100%;
  max-width: 420px;
  padding: 30px 23px;
  text-align: center;
  border-radius: 30px;
  background: rgba(255,255,255,.9);
  border: 2px solid #ffc5d9;
  box-shadow: 0 15px 45px #d9789b2b;
  animation: enter .45s ease;
}

@keyframes enter {
  from { opacity: 0; transform: translateY(12px) scale(.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.sticker {
  display: inline-block;
  font-size: 43px;
  margin-bottom: 8px;
  animation: wiggle 2s infinite ease-in-out;
}

@keyframes wiggle {
  0%,100% { transform: rotate(-5deg); }
  50% { transform: rotate(5deg); }
}

h1 {
  font-family: 'Pacifico', cursive;
  font-size: 25px;
  line-height: 1.8;
  font-weight: 400;
  color: #bd5279;
}

h2 {
  font-size: 22px;
  line-height: 1.65;
  color: #a44268;
}

p { font-size: 15px; line-height: 1.9; }

.divider {
  color: #d78ba8;
  letter-spacing: 7px;
  margin: 16px 0;
}

.progress {
  background: #ffe7ef;
  border-radius: 30px;
  height: 7px;
  overflow: hidden;
  margin: 18px 0;
}

.bar {
  height: 100%;
  background: linear-gradient(90deg, #e58aaa, #c95a84);
  border-radius: 30px;
  transition: width .4s;
}

button {
  display: block;
  width: 100%;
  padding: 14px 12px;
  margin: 12px 0;
  border: 1.5px solid #f4bdd0;
  border-radius: 18px;
  background: #fff2f6;
  color: #934361;
  font-family: 'Quicksand', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: transform .2s, background .2s;
}

button:active { transform: scale(.96); }
button:hover { background: #ffe1eb; }

.primary {
  color: white;
  background: linear-gradient(120deg, #d96691, #b84976);
  border: none;
  box-shadow: 0 5px 15px #d9669140;
}

.primary:hover { background: #b84976; }

.tiny {
  font-size: 12px;
  color: #c18aa0;
}

#letter {
  display: none;
  width: 100%;
  margin-top: 18px;
  border-radius: 12px;
  border: 2px solid #f5c5d7;
}
</style>
</head>

<body>

<main class="card" id="app">
  <div class="sticker">💝</div>

  <h1>I made something for uuuu 😍😍😍😝😝but u gotttaaaa finish these qnsss first my babygirl</h1>

  <div class="divider">🥀 ♡ 🥀</div>

  <button class="primary" onclick="startQuiz()">
    OKAYYYYY LET'S GOOOO 👀
  </button>

  <p class="tiny">made with love and konjam gaaj, just for you</p>
</main>

<script>
const questions = [
  {
    q: "1. do u think rika is funny",
    a: ["Yes", "No"]
  },
  {
    q: "2. am I funny",
    a: ["Yes", "No"]
  },
  {
    q: "3. wil u let rika hit?",
    a: ["Yes", "Yes"]
  },
  {
    q: "4. is rika ur only only only babyyyyy girl",
    a: ["Yes", "Yes"]
  },
  {
    q: "5. wil u love rika forlif😛😛",
    a: ["Yes obviously", "FORSUREEE"]
  },
  {
    q: "6. ARe u willing to be my only babyyy girl",
    a: ["Yes", "YESSSMOMMMYYYYY"]
  },
  {
    q: "7. even if I make u mad wil u still stay w me",
    a: ["Yes", "No"]
  },
  {
    q: "13. Who owns your heart?",
    a: ["Rika 💝", "My one and only Rika 💝💝💝"]
  }
];

let current = 0;

function startQuiz() {
  current = 0;
  showQuestion();
}

function showQuestion() {
  const item = questions[current];
  const progress = ((current + 1) / questions.length) * 100;

  document.getElementById("app").innerHTML = `
    <div class="sticker">${current % 2 === 0 ? "💝" : "👀"}</div>

    <p class="tiny">THE BOYFRNNNN TEST</p>

    <div class="progress">
      <div class="bar" style="width:${progress}%"></div>
    </div>

    <p class="tiny">QUESTION ${current + 1} OF ${questions.length}</p>

    <h2>${item.q}</h2>

    <div class="divider">♡ 🥀 ♡</div>

    <div id="answers"></div>

    <p class="tiny">choose wisely my babygirl 😒</p>
  `;

  const answers = document.getElementById("answers");

  item.a.forEach(answer => {
    const btn = document.createElement("button");
    btn.textContent = answer;

    btn.onclick = () => {
      current++;

      if (current < questions.length) {
        showQuestion();
      } else {
        showFinal();
      }
    };

    answers.appendChild(btn);
  });
}

function showFinal() {
  document.getElementById("app").innerHTML = `
    <div class="sticker">💝</div>

    <h1>U passseddd the cutiee TESTTTt now ur granted access to read this(konjam crine an irukum but adjust aajo🥹)👀👀👀👀🥀</h1>

    <div class="divider">🥀 ♡ 🥀</div>

    <p>ur reward(me) waiting for u😝 😅</p>

    <button class="primary" onclick="revealLetter()">
      OPEN UR idhayammm💝
    </button>
  `;
}

function revealLetter() {
  document.getElementById("app").innerHTML = `
    <div class="sticker">💝</div>

    <h1>for my babygirl uwuwuhahaha👀😝🥀</h1>

    <p>every word here is written by finger so konjam aahh va irukum but adjuss👀</p>

    <button class="primary" onclick="showEnd()">
      ONE LAST THING 👀
    </button>
  `;

  const img = document.getElementById("letter");

  img.onload = () => {
    img.style.display = "block";
    document.getElementById("hint").style.display = "none";
  };

  img.onerror = () => {
    img.style.display = "none";
  };
}

function showEnd() {
  document.getElementById("app").innerHTML = `
    <div class="sticker">💝</div>

    <h1>i love uuu my babygirl 🥀</h1>

    <div class="divider">♡ 💝 ♡</div>

    <p>no matter how many km 🤔🤔🤘🥺🥀 between us, ur still(always)special to me 😅</p>

    <button onclick="location.reload()">
      crack me💝
    </button>
  `;
}
</script>

</body>
</html>
