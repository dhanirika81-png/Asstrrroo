* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 22px;
  font-family: 'Quicksand', sans-serif;
  color: #873e5d;
  background: linear-gradient(145deg, #ffe0eb, #fff4f6, #fbd5e4);
}

.card {
  width: 100%;
  max-width: 420px;
  padding: 30px 23px;
  text-align: center;
  border-radius: 30px;
  background: rgba(255,255,255,.9);
  border: 2px solid #ffc5d9;
  box-shadow: 0 15px 45px #d9789b2b;
  animation: enter .45s ease;
}

@keyframes enter {
  from { opacity: 0; transform: translateY(12px) scale(.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}

.sticker {
  display: inline-block;
  font-size: 43px;
  margin-bottom: 8px;
  animation: wiggle 2s infinite ease-in-out;
}

@keyframes wiggle {
  0%,100% { transform: rotate(-5deg); }
  50% { transform: rotate(5deg); }
}

h1 {
  font-family: 'Pacifico', cursive;
  font-size: 25px;
  line-height: 1.8;
  font-weight: 400;
  color: #bd5279;
}

h2 {
  font-size: 22px;
  line-height: 1.65;
  color: #a44268;
}

p {
  font-size: 15px;
  line-height: 1.9;
}

.divider {
  color: #d78ba8;
  letter-spacing: 7px;
  margin: 16px 0;
}

.progress {
  background: #ffe7ef;
  border-radius: 30px;
  height: 7px;
  overflow: hidden;
  margin: 18px 0;
}

.bar {
  height: 100%;
  background: linear-gradient(90deg, #e58aaa, #c95a84);
  border-radius: 30px;
  transition: width .4s;
}

button {
  display: block;
  width: 100%;
  padding: 14px 12px;
  margin: 12px 0;
  border: 1.5px solid #f4bdd0;
  border-radius: 18px;
  background: #fff2f6;
  color: #934361;
  font-family: 'Quicksand', sans-serif;
  font-size: 15px;
  font-weight: 700;
  cursor: pointer;
  transition: transform .2s, background .2s;
  overflow-wrap: anywhere;
}

button:active {
  transform: scale(.96);
}

button:hover {
  background: #ffe1eb;
}

.primary {
  color: white;
  background: linear-gradient(120deg, #d96691, #b84976);
  border: none;
  box-shadow: 0 5px 15px #d9669140;
}

.primary:hover {

}

.tiny {
  font-size: 12px;
  color: #c18aa0;
}

#letter {

  width: 100%;
  height: auto;
  margin-top: 18px;
  border-radius: 12px;
  border: 2px solid #f5c5d7;

</style>
